[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # apisip itself uses neither crate (see the bans below). cargo-deny ignores
    # an advisory per crate, not per edge, so these stay until upstream drops them.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; still pulled in by arrow-arith, arrow-array, arrow-cast, arrow-json, parquet and object_store" },
    { id = "RUSTSEC-2026-0542", reason = "humantime unmaintained; still pulled in by object_store" },
]

[licenses]
version = 2
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Unmaintained: apisip uses jiff. Only the crates listed may still pull them in.
deny = [
    { crate = "chrono", wrappers = ["arrow-arith", "arrow-array", "arrow-cast", "arrow-json", "object_store", "parquet"] },
    { crate = "humantime", wrappers = ["object_store"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
