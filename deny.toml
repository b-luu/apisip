[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Remove once apisip and its dependencies move off these crates:
    # https://github.com/b-luu/apisip/issues/148
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, no safe upgrade; see #148" },
    { id = "RUSTSEC-2026-0542", reason = "humantime unmaintained, no safe upgrade; see #148" },
]

[licenses]
version = 2
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
