[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # serde_yaml_ng depends on it; it parses the OpenAPI spec given at init. No fixed
    # release exists. Drop this when serde_yaml_ng moves to a maintained parser.
    "RUSTSEC-2024-0449",
]

[licenses]
version = 2
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
