version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      fuzz-cargo:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /.clusterfuzzlite
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
