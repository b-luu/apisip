name: Install DuckDB
description: Download a pinned DuckDB CLI release, verify its SHA-256 and put it on PATH.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        DUCKDB_VERSION: v1.5.5
        DUCKDB_SHA256: 08c0ca117111fcede14239d0093792352befdc174218c344d232c13279643d05
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/duckdb"
        mkdir -p "$dir"
        curl -fsSL -o "$dir/duckdb.zip" \
          "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/duckdb_cli-linux-amd64.zip"
        echo "${DUCKDB_SHA256}  $dir/duckdb.zip" | sha256sum --check -
        unzip -q "$dir/duckdb.zip" -d "$dir"
        echo "$dir" >> "$GITHUB_PATH"
