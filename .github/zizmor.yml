# release.yml is generated by `dist generate`; a hand edit is overwritten on the next
# dist upgrade. These findings come from the generated text, not from our inputs:
# - every value in the flagged expressions is an output of the plan job (the tag from
#   the dispatch input, which only users with write access can set, and dist's own
#   matrix);
# - no matrix entry sets a container for our four targets;
# - the workflow-level contents: write is what dist needs to create the release.
rules:
  excessive-permissions:
    ignore:
      - release.yml
  template-injection:
    ignore:
      - release.yml
  unpinned-images:
    ignore:
      - release.yml
