# release.yml is generated by `dist generate`; a hand edit is overwritten on the next
# dist upgrade. These findings come from the generated text:
# - template-injection: `inputs.tag` and dist's `matrix.*` values go straight into
#   `run:`. Only users with write access can dispatch with a tag, and the matrix
#   comes from `dist plan` over this repository's config. On pull requests only
#   the plan job runs, and fork PRs get a read-only token.
# - excessive-permissions: the workflow-level contents: write is what dist needs
#   to create the release.
# - unpinned-images: no target sets a container.
# The ignores cover the whole file: run `dist generate --check` after any change.
rules:
  excessive-permissions:
    ignore:
      - release.yml
  template-injection:
    ignore:
      - release.yml
  unpinned-images:
    ignore:
      - release.yml
