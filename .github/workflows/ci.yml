name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/duckdb
      # rust-toolchain.toml names the pinned toolchain and its components.
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
        env:
          APISIP_REQUIRE_DUCKDB: "1"

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: "1.89"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.89 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --all-targets --locked

  s3:
    name: s3
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Throwaway values for a container that lives for this job only.
      AWS_ACCESS_KEY_ID: apisiptest
      AWS_SECRET_ACCESS_KEY: apisiptest-secret
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://127.0.0.1:8333
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/duckdb
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Start SeaweedFS
        run: |
          cat > "$RUNNER_TEMP/s3.json" <<JSON
          {"identities":[{"name":"test","credentials":[{"accessKey":"$AWS_ACCESS_KEY_ID","secretKey":"$AWS_SECRET_ACCESS_KEY"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
          JSON
          docker run -d --name seaweedfs -p 8333:8333 \
            -v "$RUNNER_TEMP/s3.json:/etc/s3.json:ro" \
            chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d \
            server -dir=/data -s3 -s3.config=/etc/s3.json
          for _ in $(seq 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$AWS_ENDPOINT_URL" || true)
            [ "$code" != 000 ] && break
            sleep 1
          done
      - name: Create the bucket
        run: |
          for _ in $(seq 30); do
            aws --endpoint-url "$AWS_ENDPOINT_URL" s3 mb s3://apisip-test && exit 0
            sleep 2
          done
          exit 1
      - run: cargo test --locked --test e2e s3 -- --nocapture
        env:
          APISIP_TEST_S3: "1"
          APISIP_TEST_S3_URL: s3://apisip-test/e2e
          APISIP_REQUIRE_DUCKDB: "1"
      - name: SeaweedFS log
        if: failure()
        run: docker logs seaweedfs | tail -50

  machete:
    name: machete
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-machete
      - run: cargo machete

  mutants:
    name: mutants
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/duckdb
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-mutants
      # Mutate only the lines this PR changed: a PR whose tests cannot tell its
      # change from a broken one fails. A push to main has no diff to check.
      - name: Mutate the changed lines
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          APISIP_REQUIRE_DUCKDB: "1"
        run: |
          git diff "$BASE_SHA"...HEAD > "$RUNNER_TEMP/pr.diff"
          cargo mutants --in-diff "$RUNNER_TEMP/pr.diff" --locked
      - name: Upload the mutants report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-out
          path: mutants.out

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/duckdb
      - run: rustup toolchain install --profile minimal --component llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-llvm-cov
      - name: Measure and report
        env:
          APISIP_REQUIRE_DUCKDB: "1"
        run: |
          cargo llvm-cov --locked --summary-only | tee "$RUNNER_TEMP/coverage.txt"
          {
            echo '### Coverage'
            echo '```'
            cat "$RUNNER_TEMP/coverage.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
