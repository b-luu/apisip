name: release-plz

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the tag
      id-token: write # crates.io trusted publishing, once configured
      actions: write # dispatch the dist release workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # release-plz pushes the tag with the git credentials.
          persist-credentials: true
      - run: rustup toolchain install --profile minimal
      - uses: release-plz/action@7ef5e4d4b0420630cfcaeb182c01e13651d4c577 # v0.5.145
        id: release-plz
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only for the first publish. Remove it once trusted publishing works.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      # A tag pushed with GITHUB_TOKEN does not start the tag-triggered workflows,
      # so start the dist release workflow on the new tag by hand.
      - name: Start the binary release
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ fromJSON(steps.release-plz.outputs.releases)[0].tag }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f tag="$TAG"

  release-pr:
    name: release-pr
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # push the release branch
      pull-requests: write # open and update the release PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # release-plz pushes the release branch with the git credentials.
          persist-credentials: true
      - run: rustup toolchain install --profile minimal
      - uses: release-plz/action@7ef5e4d4b0420630cfcaeb182c01e13651d4c577 # v0.5.145
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
